$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://raiz.local/schemas/dag-pipeline.json"
title: "DAG Pipeline (ag-0 --dag)"
description: |
  Schema para pipelines DAG executados por /ag-0-orquestrador --dag.
  Cada node e uma invocacao de machine ag-N (1..13). depends_on define grafo.
  Nodes sem depends_on mutuos na mesma camada rodam em paralelo (com worktree
  isolation obrigatorio para escrita).

type: object
required: [pipeline]
additionalProperties: false

properties:
  pipeline:
    type: object
    required: [name, nodes]
    additionalProperties: false
    properties:
      name:
        type: string
        pattern: "^[a-z][a-z0-9-]{2,49}$"
        description: "Nome do pipeline (slug). Usado em state file e PR titles."

      description:
        type: string
        maxLength: 280

      on_failure:
        type: string
        enum: [abort, continue]
        default: abort
        description: "abort = falha de qualquer node critico aborta cascata. continue = nodes nao-dependentes continuam."

      max_parallel:
        type: integer
        minimum: 1
        maximum: 6
        default: 4
        description: "Max nodes em paralelo. Cap em 6 (memory_pressure). Cap em 4 quando warn."

      state_path:
        type: string
        default: "~/Claude/docs/ai-state/dag-state-{name}-{timestamp}.json"
        description: "Onde gravar state intermediario para resume."

      nodes:
        type: array
        minItems: 1
        items:
          type: object
          required: [id, machine]
          additionalProperties: false
          properties:
            id:
              type: string
              pattern: "^[a-z][a-z0-9_]{0,49}$"
              description: "ID unico do node dentro do pipeline."

            machine:
              type: string
              pattern: "^ag-(0|[1-9]|1[0-3])$"
              description: "ag-0..ag-13. Outras skills nao sao permitidas como nodes (use sub-agents dentro da machine)."

            args:
              type: string
              description: "Args literais passados a machine (apos o nome)."

            depends_on:
              type: array
              items:
                type: string
              uniqueItems: true
              default: []
              description: "IDs dos nodes que devem completar antes."

            isolation:
              type: string
              enum: [none, worktree]
              default: none
              description: "worktree obrigatorio para nodes de escrita rodando em paralelo. Engine valida e bloqueia se overlap detectado."

            condition:
              type: string
              description: |
                Expressao avaliada apos depends_on. Linguagem: subset Jinja-like com
                acesso a outputs dos nodes anteriores. Exemplos:
                  "{{ qa.MQS }} >= 85"
                  "{{ build_fe.exit_code == 0 and build_be.exit_code == 0 }}"
                Se false: node e skipped (status=skipped no state).

            mode:
              type: string
              enum: [interativo, autonomo, draft]
              default: autonomo
              description: "Modo passado a machine. DAG padrao = autonomo (sem checkpoints)."

            timeout_s:
              type: integer
              minimum: 60
              maximum: 3600
              default: 1800
              description: "Timeout maximo. Apos: node = failed."

            critical:
              type: boolean
              default: true
              description: "Se false: falha do node nao aborta cascata mesmo com on_failure=abort."

            outputs:
              type: array
              items:
                type: string
              description: "Nomes de outputs esperados (declarativo). Engine extrai do state file da machine."

# Exemplo:
#
# pipeline:
#   name: feature-com-audit
#   description: "Build FE+BE paralelo, QA serial, audit condicional"
#   on_failure: abort
#   max_parallel: 4
#   nodes:
#     - id: spec
#       machine: ag-1
#       args: "spec auth-flow"
#       outputs: [spec_path]
#
#     - id: build_fe
#       machine: ag-1
#       args: "implementar auth-flow frontend"
#       depends_on: [spec]
#       isolation: worktree
#
#     - id: build_be
#       machine: ag-1
#       args: "implementar auth-flow backend"
#       depends_on: [spec]
#       isolation: worktree
#
#     - id: qa
#       machine: ag-7
#       args: ""
#       depends_on: [build_fe, build_be]
#
#     - id: audit
#       machine: ag-9
#       args: ""
#       depends_on: [qa]
#       condition: "{{ qa.MQS }} >= 85"
#       critical: false
